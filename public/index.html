
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Attendance Management System</h1>
        <p>Manage student records and attendance easily</p>
    </header>

    <main>

        <section>
            <h2>Add New Student</h2>

            <input type="text" id="name" placeholder="Enter Student Name">
            <input type="text" id="roll" placeholder="Enter Roll Number">

            <button onclick="addStudent()">Add Student</button>
        </section>

        <section>
            <h2>Mark Attendance</h2>

            <input type="text" id="studentId" placeholder="Enter Roll Number">

            <select id="status">
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
            </select>

            <button onclick="markAttendance()">Submit Attendance</button>
        </section>

        <section>
            <h2>Attendance Records</h2>

            <button onclick="viewAttendance()">View Records</button>

            <pre id="records"></pre>
        </section>

    </main>

    <script>
        async function addStudent() {
            const name = document.getElementById('name').value;
            const roll = document.getElementById('roll').value;

            if (!name || !roll) {
                alert('Please enter all details');
                return;
            }

            const response = await fetch('/students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, roll })
            });

            const result = await response.json();
            alert(result.message);
        }

        async function markAttendance() {
            const roll = document.getElementById('studentId').value;
            const status = document.getElementById('status').value;

            if (!roll) {
                alert('Please enter Roll Number');
                return;
            }

            const response = await fetch('/attendance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    roll,
                    status,
                    date: new Date().toLocaleDateString()
                })
            });

            const result = await response.json();
            alert(result.message);
        }

        async function viewAttendance() {
            const response = await fetch('/attendance');
            const data = await response.json();

            document.getElementById('records').textContent =
                JSON.stringify(data, null, 2);
        }
    </script>

</body>
</html>
